<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bill Tracker Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configure Tailwind for Dark Mode
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        :root { --app-font-size: 16px; }
        html { font-size: var(--app-font-size); transition: background-color 0.3s ease; }
        
        .modal-overlay { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }

        @media (max-width: 1024px) {
            .notes-sidebar {
                position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
                border-radius: 24px 24px 0 0;
                transform: translateY(calc(100% - 60px));
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .notes-sidebar.open { transform: translateY(0); }
        }

        .today-card { 
            border: 2px solid #3b82f6 !important; 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #3b82f6; }
            50% { border-color: #93c5fd; }
            100% { border-color: #3b82f6; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans text-slate-900 dark:text-slate-100 pb-20 lg:pb-0 transition-colors duration-300">

    <div class="max-w-[1400px] mx-auto px-4 py-6 lg:py-10">
        
        <section id="todayBar" class="mb-8 bg-blue-600 dark:bg-blue-800 rounded-[2rem] p-6 lg:p-8 text-white shadow-xl flex flex-col lg:flex-row lg:items-center gap-6">
            <div class="flex-shrink-0 flex lg:flex-col justify-between items-center lg:items-start gap-4">
                <div>
                    <div class="text-blue-200 font-bold uppercase text-xs tracking-widest mb-1">Today's Date</div>
                    <div class="text-4xl font-black" id="todayDateDisplay">--</div>
                </div>
                
                <div class="flex gap-2 items-center">
                    <div class="bg-blue-700/50 dark:bg-slate-900/40 p-1 rounded-xl flex items-center">
                        <button onclick="changeFontSize(14)" class="px-2 py-1 text-xs font-bold rounded-lg hover:bg-blue-500 transition">A</button>
                        <button onclick="changeFontSize(16)" class="px-2 py-1 text-base font-bold rounded-lg hover:bg-blue-500 transition">A</button>
                        <button onclick="changeFontSize(20)" class="px-2 py-1 text-xl font-bold rounded-lg hover:bg-blue-500 transition">A</button>
                    </div>
                    <button onclick="toggleDarkMode()" class="bg-blue-700/50 dark:bg-slate-900/40 p-2 rounded-xl hover:bg-blue-500 transition">
                        <span id="darkIcon" class="text-lg">🌙</span>
                    </button>
                </div>
            </div>
            
            <div class="flex-grow bg-blue-700/50 dark:bg-slate-900/20 rounded-2xl p-4 min-h-[80px]">
                <div class="text-[10px] font-bold uppercase tracking-widest text-blue-200 mb-2">Bills Due Today</div>
                <div id="todayBillsList" class="flex flex-wrap gap-3"></div>
            </div>

            <div class="text-right flex-shrink-0">
                <div class="text-blue-200 font-bold uppercase text-[10px] tracking-widest">Monthly Total</div>
                <div id="grandTotal" class="text-3xl font-black">£0.00</div>
            </div>
        </section>

        <div class="flex flex-col lg:flex-row gap-6">
            <div class="flex-grow">
                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 xl:grid-cols-7 gap-3" id="grid"></div>
                <div class="mt-8 mb-10 text-center">
                    <button onclick="clearAll()" class="text-[10px] font-bold text-slate-400 hover:text-red-500 uppercase tracking-widest transition">Reset Calendar Data</button>
                </div>
            </div>

            <div id="notesSidebar" class="notes-sidebar w-full lg:w-80 shrink-0 bg-white dark:bg-slate-900 shadow-lg lg:shadow-sm border border-slate-200 dark:border-slate-800 p-6">
                <div class="lg:hidden w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-4 cursor-pointer" onclick="toggleNotes()"></div>
                <h3 class="text-lg font-black text-slate-800 dark:text-slate-200 mb-4">📝 NOTES</h3>
                <textarea id="notesArea" onkeydown="handleNoteKeys(event)" oninput="saveNotes()" class="w-full h-[300px] lg:h-[600px] p-4 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none text-sm custom-scroll dark:text-slate-100"></textarea>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onclick="handleBackdrop(event)">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-8 overflow-y-auto custom-scroll">
                <div class="flex justify-between items-start mb-6">
                    <h2 class="text-2xl font-black text-slate-800 dark:text-slate-100" id="modalTitle">Day Details</h2>
                    <button onclick="closeModal()" class="text-slate-300 dark:text-slate-600 text-3xl hover:text-slate-500">&times;</button>
                </div>

                <div class="flex flex-col gap-3 mb-8 bg-slate-50 dark:bg-slate-800 p-5 rounded-3xl border border-slate-100 dark:border-slate-700">
                    <div class="flex gap-2">
                        <input type="text" id="billName" placeholder="Title" class="w-2/3 bg-white dark:bg-slate-900 px-5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 outline-none dark:text-white">
                        <input type="number" id="billAmount" placeholder="£" class="w-1/3 bg-white dark:bg-slate-900 px-5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 outline-none dark:text-white">
                    </div>
                    <input type="text" id="billDesc" placeholder="Description (Optional)" class="bg-white dark:bg-slate-900 px-5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 outline-none text-sm dark:text-white">
                    <button onclick="addBill()" class="bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition active:scale-95">Add Bill</button>
                </div>

                <div class="space-y-4" id="modalList"></div>

                <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center bg-white dark:bg-slate-900 sticky bottom-0">
                    <span class="font-bold text-slate-400 uppercase text-[10px] tracking-widest">Day Total</span>
                    <span id="modalTotal" class="text-2xl font-black text-blue-600">£0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let bills = JSON.parse(localStorage.getItem('billTrackerV7')) || {};
        let activeDay = null;
        const now = new Date();
        const currentDayOfMonth = now.getDate();

        // FONT & DARK MODE LOGIC
        function changeFontSize(size) {
            document.documentElement.style.setProperty('--app-font-size', size + 'px');
            localStorage.setItem('appFontSize', size);
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('darkIcon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('darkIcon').innerText = '🌙';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('appTheme', newTheme);
            applyTheme(newTheme);
        }

        // Auto-detect system theme
        const savedTheme = localStorage.getItem('appTheme');
        if (savedTheme) {
            applyTheme(savedTheme);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            applyTheme('dark');
        }

        const savedFontSize = localStorage.getItem('appFontSize') || 16;
        changeFontSize(savedFontSize);

        // UI RENDERING
        function renderTodayBar() {
            const display = document.getElementById('todayDateDisplay');
            const list = document.getElementById('todayBillsList');
            display.innerText = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
            const todayBills = bills[currentDayOfMonth] || [];
            list.innerHTML = '';
            if (todayBills.length === 0) {
                list.innerHTML = '<span class="text-blue-200 italic text-sm opacity-80">No bills due today.</span>';
                return;
            }
            todayBills.forEach((b, idx) => {
                const btn = document.createElement('button');
                btn.onclick = () => togglePaidSpecific(currentDayOfMonth, idx);
                btn.className = `px-4 py-2 rounded-xl text-xs font-bold transition text-left flex flex-col ${b.paid ? 'bg-green-500 text-white opacity-80' : 'bg-white dark:bg-slate-900 text-blue-600 dark:text-blue-400 shadow-sm border dark:border-slate-700'}`;
                btn.innerHTML = `<span>${b.paid ? '✓' : ''} ${b.name} - £${parseFloat(b.amount).toFixed(2)}</span>${b.desc ? `<span class="text-[10px] opacity-70 font-normal">${b.desc}</span>` : ''}`;
                list.appendChild(btn);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let totalMonth = 0;
            for (let i = 1; i <= 31; i++) {
                const dayBills = bills[i] || [];
                const dayTotal = dayBills.reduce((sum, b) => sum + parseFloat(b.amount || 0), 0);
                const paidCount = dayBills.filter(b => b.paid).length;
                totalMonth += dayTotal;
                const isToday = (i === currentDayOfMonth);
                const card = document.createElement('div');
                card.className = `bg-white dark:bg-slate-900 p-4 rounded-2xl border ${isToday ? 'today-card' : 'border-slate-200 dark:border-slate-800'} ${dayBills.length > 0 && paidCount === dayBills.length ? 'bg-green-50 dark:bg-green-950/20' : ''} shadow-sm transition-all flex flex-col items-center cursor-pointer relative overflow-hidden`;
                card.onclick = () => openModal(i);
                const progressWidth = dayBills.length ? (paidCount / dayBills.length) * 100 : 0;
                card.innerHTML = `<div class="absolute top-0 left-0 h-1 bg-green-500 transition-all" style="width: ${progressWidth}%"></div><span class="text-2xl font-black ${isToday ? 'text-blue-600 dark:text-blue-400' : 'text-slate-800 dark:text-slate-200'} mb-1">${i}</span><span class="text-[9px] font-bold uppercase tracking-widest ${paidCount === dayBills.length && dayBills.length > 0 ? 'text-green-600' : 'text-slate-500'}">${paidCount}/${dayBills.length} Paid</span>${dayTotal > 0 ? `<div class="text-xs font-black text-slate-600 dark:text-slate-400 mt-1">£${dayTotal.toFixed(0)}</div>` : ''}`;
                grid.appendChild(card);
            }
            document.getElementById('grandTotal').innerText = `£${totalMonth.toFixed(2)}`;
            renderTodayBar();
        }

        function togglePaidSpecific(day, idx) {
            bills[day][idx].paid = !bills[day][idx].paid;
            save();
            if (activeDay === day) renderModalList();
        }

        function renderModalList() {
            const list = document.getElementById('modalList');
            const dayBills = bills[activeDay] || [];
            list.innerHTML = dayBills.length ? '' : '<p class="text-slate-400 italic text-center py-10 text-sm">No bills added yet.</p>';
            let total = 0;
            dayBills.forEach((b, idx) => {
                total += parseFloat(b.amount || 0);
                list.innerHTML += `<div class="flex justify-between items-start p-4 ${b.paid ? 'bg-green-50 dark:bg-green-900/10 border-green-200 dark:border-green-900/30' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'} rounded-2xl border shadow-sm transition"><div class="flex items-start gap-4"><button onclick="togglePaidSpecific(${activeDay}, ${idx})" class="mt-1 w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${b.paid ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800'}">${b.paid ? '✓' : ''}</button><div><div class="font-bold text-slate-800 dark:text-slate-200 text-sm ${b.paid ? 'line-through opacity-50' : ''}">${b.name}</div><div class="text-xs font-bold text-blue-600 dark:text-blue-400 mb-1">£${parseFloat(b.amount).toFixed(2)}</div>${b.desc ? `<div class="text-[11px] text-slate-500 dark:text-slate-400 leading-tight">${b.desc}</div>` : ''}</div></div><button onclick="deleteBill(${idx})" class="text-slate-300 hover:text-red-500 text-xl px-2">&times;</button></div>`;
            });
            document.getElementById('modalTotal').innerText = `£${total.toFixed(2)}`;
        }

        // HELPERS
        function toggleNotes() { document.getElementById('notesSidebar').classList.toggle('open'); }
        function saveNotes() { localStorage.setItem('notesV7', document.getElementById('notesArea').value); }
        function loadNotes() { document.getElementById('notesArea').value = localStorage.getItem('notesV7') || '• '; }
        function handleNoteKeys(e) { if (e.target.value === '') e.target.value = '• '; if (e.key === 'Enter') { e.preventDefault(); const start = e.target.selectionStart; e.target.value = e.target.value.substring(0, start) + "\n• " + e.target.value.substring(e.target.selectionEnd); e.target.selectionStart = e.target.selectionEnd = start + 3; } }
        function openModal(day) { activeDay = day; document.getElementById('modalTitle').innerText = `Day ${day}`; document.getElementById('modal').classList.remove('hidden'); renderModalList(); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function handleBackdrop(e) { if(e.target.id === 'modal') closeModal(); }
        function addBill() { const name = document.getElementById('billName').value; const amount = document.getElementById('billAmount').value; const desc = document.getElementById('billDesc').value; if (name && amount) { if (!bills[activeDay]) bills[activeDay] = []; bills[activeDay].push({ name, amount, desc, paid: false }); save(); document.getElementById('billName').value = ''; document.getElementById('billAmount').value = ''; document.getElementById('billDesc').value = ''; renderModalList(); } }
        function deleteBill(index) { bills[activeDay].splice(index, 1); save(); renderModalList(); }
        function save() { localStorage.setItem('billTrackerV7', JSON.stringify(bills)); renderGrid(); }
        function clearAll() { if(confirm("Are you sure? This will delete all bills and cannot be undone.")) { bills = {}; save(); } }

        loadNotes();
        renderGrid();
    </script>
</body>
</html>
