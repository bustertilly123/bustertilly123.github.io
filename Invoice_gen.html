<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Manager (Optimized Reads)</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .input-field {
            @apply mt-1 block w-full p-3 rounded-lg shadow-xl focus:ring-indigo-500 focus:border-indigo-500;
            border: 3px solid #000000;
            width: 100%;
        }
        input[type="radio"] { border: 2px solid #000000; }
        .jobs-container:not([style*="display: none"]) + .week-group .rotate-180 {
            transform: rotate(0deg) !important;
        }
    </style>

    <script type="module">
        import PizZip from "https://esm.sh/pizzip@3.1.6";
        import Docxtemplater from "https://esm.sh/docxtemplater";
        import saveAs from "https://esm.sh/file-saver";

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore, doc, setDoc, getDoc, getDocs, collection, query, orderBy, limit, deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================================
        // SECTION 1: CONSTANTS & GLOBAL STATE
        // ==========================================================
        const LABOUR_TAX_RATE = 0.20;
        const LABOUR_AFTER_TAX_MULTIPLIER = 1 - LABOUR_TAX_RATE;
        const DB_COLLECTION = 'jobs';
        const INVOICE_NUMBERS_DOC_PATH = 'invoice_config/current_numbers';

        let app, db, auth;
        let userId = null;
        let allJobs = [];
        let isAuthReady = false;

        let INVOICE_MAJOR_NUMBER = 25;
        let saltashLastMinor = 0;
        let freshbuildLastMinor = 0;

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAX7GYX247S69b6blLBcja-_IHU6Y9i3hI",
            authDomain: "tools-9bf35.firebaseapp.com",
            projectId: "tools-9bf35",
            storageBucket: "tools-9bf35.firebasestorage.app",
            messagingSenderId: "803649385600",
            appId: "1:803649385600:web:79fc8ed25d35ebdf032265"
        };

        const appId = FIREBASE_CONFIG.projectId;

        // Restore Client Address Data
        const CLIENT_DATA = {
            FRESHBUILD: { name: 'FRESHBUILD LIMITED', address: 'SHALIMER, CRICKET GROUND RD\nCHISLEHURST\nKENT\nBR7 5HD' },
            SALTASH: { name: 'SALTASH ENTERPRISES LIMITED', address: '110- 116 ORMSIDE STREET\nLONDON, SE15 1TF' }
        };

        // ==========================================================
        // SECTION 2: OPTIMIZED FIREBASE LOGIC
        // ==========================================================

        function getJobsCollectionRef() {
            const path = `artifacts/${appId}/public/data/${DB_COLLECTION}`;
            // OPTIMIZATION: Limits reads to the 50 most recent jobs
            return query(collection(db, path), orderBy("date", "desc"), limit(50));
        }

        async function initFirebase() {
            const statusDisplay = document.getElementById('authStatus');
            try {
                app = initializeApp(FIREBASE_CONFIG);
                db = getFirestore(app);
                auth = getAuth(app);
                await setPersistence(auth, browserLocalPersistence);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        statusDisplay.textContent = `Status: Authenticated`;
                        if (!isAuthReady) {
                            isAuthReady = true;
                            await loadInitialData();
                        }
                    }
                });
                await signInAnonymously(auth);
            } catch (error) {
                statusDisplay.textContent = `Error: ${error.message}`;
            }
        }

        async function loadInitialData() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            loadingIndicator.style.display = 'block';

            try {
                // Fetch Invoice Config Once (Optimization)
                const configRef = doc(db, `artifacts/${appId}/public/data/${INVOICE_NUMBERS_DOC_PATH}`);
                const configSnap = await getDoc(configRef);
                if (configSnap.exists()) {
                    const data = configSnap.data();
                    INVOICE_MAJOR_NUMBER = data.majorNumber || 25;
                    freshbuildLastMinor = data.freshbuildMinor || 0;
                    saltashLastMinor = data.saltashMinor || 0;
                }

                // Fetch Jobs Once (Optimization)
                const jobsSnap = await getDocs(getJobsCollectionRef());
                allJobs = jobsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                renderJobs();
            } catch (error) {
                console.error("Data Load Error:", error);
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // ==========================================================
        // SECTION 3: RESTORED ORIGINAL CORE FUNCTIONS
        // ==========================================================

        window.formatCurrency = (value) => '£' + (parseFloat(value) || 0).toFixed(2);

        window.calculateNetJobCost = (job) => {
            const labour = parseFloat(job.labourPrice) || 0;
            const material = parseFloat(job.materialPrice) || 0;
            const labourAfterTax = labour * LABOUR_AFTER_TAX_MULTIPLIER;
            return { totalNet: labourAfterTax + material, labourAfterTax, material };
        };

        window.getWeekStartDate = (dateString) => {
            if (!dateString) return 'Unscheduled';
            const date = new Date(dateString + 'T00:00:00');
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff)).toISOString().split('T')[0];
        };

        window.addJob = async function(event) {
            event.preventDefault();
            const form = event.target;
            const newJob = {
                client: form.client.value,
                date: form.date.value,
                description: form.description.value,
                labourPrice: parseFloat(form.labourPrice.value) || 0,
                materialPrice: parseFloat(form.materialPrice.value) || 0,
                createdAt: new Date().toISOString()
            };

            try {
                const newDocRef = doc(collection(db, `artifacts/${appId}/public/data/${DB_COLLECTION}`));
                await setDoc(newDocRef, newJob);
                await loadInitialData(); // Refresh list once
                form.reset();
            } catch (e) {
                alert("Error: " + e.message);
            }
        };

        window.deleteJob = async function(jobId) {
            if (!confirm("Delete this job?")) return;
            try {
                await deleteDoc(doc(db, `artifacts/${appId}/public/data/${DB_COLLECTION}`, jobId));
                allJobs = allJobs.filter(j => j.id !== jobId);
                renderJobs();
            } catch (e) {
                alert("Error: " + e.message);
            }
        };

        // --- RENDER LOGIC (Restored Original Grouping) ---
        window.renderJobs = function() {
            const container = document.getElementById('jobsList');
            const search = document.getElementById('jobSearch').value.toLowerCase();
            
            const filtered = allJobs.filter(j => 
                j.client.toLowerCase().includes(search) || 
                j.description.toLowerCase().includes(search)
            );

            // Group by Week Logic from original Invoice_gen.html
            const groups = filtered.reduce((acc, job) => {
                const week = window.getWeekStartDate(job.date);
                if (!acc[week]) acc[week] = [];
                acc[week].push(job);
                return acc;
            }, {});

            container.innerHTML = Object.keys(groups).sort().reverse().map(week => `
                <div class="mb-6">
                    <h3 class="font-bold text-lg mb-2">${week}</h3>
                    ${groups[week].map(job => `
                        <div class="p-4 bg-white border-2 border-black rounded-xl mb-2 flex justify-between items-center">
                            <div>
                                <p class="font-bold">${job.client}</p>
                                <p class="text-sm text-gray-600">${job.description}</p>
                            </div>
                            <button onclick="deleteJob('${job.id}')" class="text-red-600 font-bold">Delete</button>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        };

        window.onload = initFirebase;
    </script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Job Manager</h1>
            <div id="authStatus" class="text-sm bg-white px-3 py-1 border border-black rounded-full">Auth...</div>
        </div>

        <div id="loadingIndicator" style="display:none;" class="mb-4 text-indigo-600 animate-pulse font-bold">Updating Data...</div>

        <form onsubmit="addJob(event)" class="bg-white p-6 rounded-2xl border-2 border-black shadow-xl mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <input name="client" placeholder="Client Name" class="input-field" required>
                <input name="date" type="date" class="input-field" required>
            </div>
            <textarea name="description" placeholder="Work Description" class="input-field mb-4" required></textarea>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <input name="labourPrice" type="number" step="0.01" placeholder="Labour £" class="input-field">
                <input name="materialPrice" type="number" step="0.01" placeholder="Material £" class="input-field">
            </div>
            <button type="submit" class="w-full bg-black text-white p-4 rounded-xl font-bold hover:bg-gray-800">Add Job</button>
        </form>

        <input type="text" id="jobSearch" oninput="renderJobs()" placeholder="Search jobs..." class="input-field mb-6">
        
        <div id="jobsList"></div>
    </div>
</body>
</html>
