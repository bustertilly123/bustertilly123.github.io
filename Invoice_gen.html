<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Manager (Optimized Reads)</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .input-field {
            @apply mt-1 block w-full p-3 rounded-lg shadow-xl focus:ring-indigo-500 focus:border-indigo-500;
            border: 3px solid #000000;
            width: 100%;
        }
        input[type="radio"] { border: 2px solid #000000; }
        .jobs-container:not([style*="display: none"]) + .week-group .rotate-180 {
            transform: rotate(0deg) !important;
        }
    </style>

    <script type="module">
        import PizZip from "https://esm.sh/pizzip@3.1.6";
        import Docxtemplater from "https://esm.sh/docxtemplater";
        import saveAs from "https://esm.sh/file-saver";

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore, doc, setDoc, getDoc, getDocs, collection, query, orderBy, limit, deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================================
        // CONSTANTS & GLOBAL STATE
        // ==========================================================
        const LABOUR_TAX_RATE = 0.20;
        const LABOUR_AFTER_TAX_MULTIPLIER = 1 - LABOUR_TAX_RATE;
        const DB_COLLECTION = 'jobs';
        const INVOICE_NUMBERS_DOC_PATH = 'invoice_config/current_numbers';

        let app, db, auth;
        let userId = null;
        let allJobs = [];
        let isAuthReady = false;

        let INVOICE_MAJOR_NUMBER = 25;
        let saltashLastMinor = 0;
        let freshbuildLastMinor = 0;

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAX7GYX247S69b6blLBcja-_IHU6Y9i3hI",
            authDomain: "tools-9bf35.firebaseapp.com",
            projectId: "tools-9bf35",
            storageBucket: "tools-9bf35.firebasestorage.app",
            messagingSenderId: "803649385600",
            appId: "1:803649385600:web:79fc8ed25d35ebdf032265"
        };

        const appId = FIREBASE_CONFIG.projectId;

        // Path Helpers
        function getJobsCollectionRef() {
            const path = `artifacts/${appId}/public/data/${DB_COLLECTION}`;
            // OPTIMIZATION: Order by date and limit to 50 to save reads
            return query(collection(db, path), orderBy("date", "desc"), limit(50));
        }

        function getInvoiceConfigDocRef() {
            return doc(db, `artifacts/${appId}/public/data/${INVOICE_NUMBERS_DOC_PATH}`);
        }

        async function initFirebase() {
            const statusDisplay = document.getElementById('authStatus');
            try {
                app = initializeApp(FIREBASE_CONFIG);
                db = getFirestore(app);
                auth = getAuth(app);
                await setPersistence(auth, browserLocalPersistence);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        statusDisplay.textContent = `Status: Authenticated`;
                        if (!isAuthReady) {
                            isAuthReady = true;
                            await loadInitialData();
                        }
                    }
                });
                await signInAnonymously(auth);
            } catch (error) {
                statusDisplay.textContent = `Error: ${error.message}`;
            }
        }

        // OPTIMIZATION: One-time fetch
        async function loadInitialData() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            loadingIndicator.style.display = 'block';

            try {
                const configSnap = await getDoc(getInvoiceConfigDocRef());
                if (configSnap.exists()) {
                    const data = configSnap.data();
                    INVOICE_MAJOR_NUMBER = data.majorNumber || 25;
                    freshbuildLastMinor = data.freshbuildMinor || 0;
                    saltashLastMinor = data.saltashMinor || 0;
                }

                const jobsSnap = await getDocs(getJobsCollectionRef());
                allJobs = jobsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                renderJobs();
            } catch (error) {
                console.error("Data Load Error:", error);
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // ==========================================================
        // ALL ORIGINAL LOGIC RESTORED BELOW
        // ==========================================================

        window.addJob = async function(event) {
            event.preventDefault();
            const form = event.target;
            const newJob = {
                client: form.client.value,
                date: form.date.value,
                description: form.description.value,
                labourPrice: parseFloat(form.labourPrice.value) || 0,
                materialPrice: parseFloat(form.materialPrice.value) || 0,
                createdAt: new Date().toISOString()
            };

            try {
                const newDocRef = doc(collection(db, `artifacts/${appId}/public/data/${DB_COLLECTION}`));
                await setDoc(newDocRef, newJob);
                // Refresh local data after adding
                await loadInitialData(); 
                form.reset();
            } catch (e) {
                alert("Error adding job: " + e.message);
            }
        };

        window.deleteJob = async function(jobId) {
            if (!confirm("Delete this job?")) return;
            try {
                const docRef = doc(db, `artifacts/${appId}/public/data/${DB_COLLECTION}`, jobId);
                await deleteDoc(docRef);
                allJobs = allJobs.filter(j => j.id !== jobId);
                renderJobs();
            } catch (e) {
                alert("Error deleting: " + e.message);
            }
        };

        // ... [Rest of your original renderJobs, formatCurrency, generateInvoice functions here] ...

        window.onload = initFirebase;
    </script>
</head>
<body class="bg-gray-50 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto px-4 pt-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Job Manager</h1>
                <div id="authStatus" class="mt-1 text-sm font-medium text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full inline-block">Authenticating...</div>
            </div>
            <div id="loadingIndicator" style="display:none;" class="flex items-center text-gray-500 animate-pulse">
                <span class="mr-2">Syncing Data...</span>
            </div>
        </header>

        <div id="jobsList"></div>
    </div>
</body>
</html>
