<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Manager</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .input-field {
            /* Tailwind classes for width, padding, shadow, and focus */
            @apply mt-1 block w-full p-3 rounded-lg shadow-xl focus:ring-indigo-500 focus:border-indigo-500;
            border: 3px solid #000000; /* Distinct Black Border for form elements */
            width: 100%;
        }

        input[type="radio"] {
            border: 2px solid #000000;
        }

        /* Styling to prevent rotation on details open */
        .jobs-container:not([style*="display: none"]) + .week-group .rotate-180 {
            transform: rotate(0deg) !important;
        }
    </style>

    <script type="module">
        // ===============================================
        // SECTION 0: DOCX & UTILITY IMPORTS
        // ===============================================
        import PizZip from "https://esm.sh/pizzip@3.1.6";
        import Docxtemplater from "https://esm.sh/docxtemplater";
        import saveAs from "https://esm.sh/file-saver";

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore, doc, setDoc, onSnapshot, collection, query, deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================================
        // SECTION 1: CONSTANTS & GLOBAL STATE
        // ==========================================================
        const LABOUR_TAX_RATE = 0.20;
        const LABOUR_AFTER_TAX_MULTIPLIER = 1 - LABOUR_TAX_RATE;

        const DB_COLLECTION = 'jobs';
        const INVOICE_NUMBERS_DOC_PATH = 'invoice_config/current_numbers';

        let app, db, auth;
        let userId = null;
        let allJobs = [];
        let isAuthReady = false;
        let areInvoiceNumbersLoaded = false;

        let INVOICE_MAJOR_NUMBER = 0;
        let saltashLastMinor = 0;
        let freshbuildLastMinor = 0;

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAX7GYX247S69b6blLBcja-_IHU6Y9i3hI",
            authDomain: "tools-9bf35.firebaseapp.com",
            projectId: "tools-9bf35",
            storageBucket: "tools-9bf35.firebasestorage.app",
            messagingSenderId: "803649385600",
            appId: "1:803649385600:web:79fc8ed25d35ebdf032265"
        };

        const appId = FIREBASE_CONFIG.projectId;

        const CLIENT_DATA = {
            FRESHBUILD: { name: 'FRESHBUILD LIMITED', address: 'SHALIMER, CRICKET GROUND RD\nCHISLEHURST\nKENT\nBR7 5HD' },
            SALTASH: { name: 'SALTASH ENTERPRISES LIMITED', address: '110- 116 ORMSIDE STREET\nLONDON, SE15 1TF' }
        };

        // ==========================================================
        // SECTION 2: FIREBASE INITIALIZATION
        // ==========================================================
        function getJobsCollectionRef() { return collection(db, `artifacts/${appId}/public/data/${DB_COLLECTION}`); }
        function getInvoiceConfigDocRef() { return doc(db, `artifacts/${appId}/public/data/${INVOICE_NUMBERS_DOC_PATH}`); }

        async function initFirebase() {
            try {
                app = initializeApp(FIREBASE_CONFIG);
                db = getFirestore(app);
                auth = getAuth(app);
                await setPersistence(auth, browserLocalPersistence);
                await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        if (!isAuthReady) {
                            isAuthReady = true;
                            setupInvoiceNumberListener();
                        }
                    }
                });
            } catch (error) { console.error("Firebase Init Error:", error); }
        }

        function setupInvoiceNumberListener() {
            onSnapshot(getInvoiceConfigDocRef(), (docSnapshot) => {
                const data = docSnapshot.data();
                if (data) {
                    INVOICE_MAJOR_NUMBER = data.majorNumber || 25;
                    freshbuildLastMinor = data.freshbuildMinor || 0;
                    saltashLastMinor = data.saltashMinor || 0;
                }
                if (!areInvoiceNumbersLoaded) {
                    areInvoiceNumbersLoaded = true;
                    setupJobsListener();
                } else { renderJobs(); }
            });
        }

        function setupJobsListener() {
            onSnapshot(query(getJobsCollectionRef()), (snapshot) => {
                allJobs = [];
                snapshot.forEach((doc) => allJobs.push({ id: doc.id, ...doc.data() }));
                renderJobs();
            });
        }

        // ==========================================================
        // SECTION 3: UTILITIES & CALCULATIONS
        // ==========================================================
        function formatCurrency(value) { return '£' + (parseFloat(value) || 0).toFixed(2); }

        function calculateNetJobCost(job) {
            const labour = parseFloat(job.labourPrice) || 0;
            const material = parseFloat(job.materialPrice) || 0;
            const netLabour = labour * LABOUR_AFTER_TAX_MULTIPLIER;
            return { grossLabour: labour, netLabour, material, totalNet: netLabour + material };
        }

        function getWeekStartDate(dateString) {
            if (!dateString) return 'Unscheduled';
            const date = new Date(dateString + 'T00:00:00');
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff)).toISOString().split('T')[0];
        }

        function formatWeekRange(dateString) {
            if (dateString === 'Unscheduled') return 'Unscheduled Jobs';
            const start = new Date(dateString + 'T00:00:00');
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            return `Week of ${start.toLocaleDateString('en-GB')} – ${end.toLocaleDateString('en-GB')}`;
        }

        function aggregateInvoiceData(jobs, invoiceNumber) {
            let totalLabourGross = 0, totalMaterials = 0;
            jobs.forEach(job => {
                const costs = calculateNetJobCost(job);
                totalLabourGross += costs.grossLabour;
                totalMaterials += costs.material;
            });
            const tax = totalLabourGross * LABOUR_TAX_RATE;
            return {
                INVOICE_NUMBER: invoiceNumber,
                INVOICE_DATE: new Date().toLocaleDateString('en-GB'),
                TOTAL: (totalLabourGross + totalMaterials).toFixed(2),
                LABOUR: totalLabourGross.toFixed(2),
                MATERIALS: totalMaterials.toFixed(2),
                TAX: tax.toFixed(2),
                AFTER_TAX: (totalLabourGross - tax + totalMaterials).toFixed(2)
            };
        }

        async function saveInvoiceNumbers(major, fbMinor, saMinor) {
            try {
                await setDoc(getInvoiceConfigDocRef(), { majorNumber: major, freshbuildMinor: fbMinor, saltashMinor: saMinor }, { merge: true });
                return true;
            } catch (e) { return false; }
        }

        // ==========================================================
        // SECTION 4: RENDERING (WEEKLY BREAKDOWN & HEADERS)
        // ==========================================================
        window.renderJobs = function () {
            const container = document.getElementById('jobList');
            container.innerHTML = '';
            const searchTerm = document.getElementById('jobSearch').value.toLowerCase().trim();

            const filteredJobs = allJobs.filter(job =>
                [job.title, job.description].join(' ').toLowerCase().includes(searchTerm)
            );

            const grouped = filteredJobs.reduce((acc, job) => {
                const week = getWeekStartDate(job.dateCompleted);
                if (!acc[week]) acc[week] = [];
                acc[week].push(job);
                return acc;
            }, {});

            const sortedWeeks = Object.keys(grouped).sort((a, b) => b === 'Unscheduled' ? -1 : new Date(b) - new Date(a));

            sortedWeeks.forEach(week => {
                const weekJobs = grouped[week];
                let totalW = 0, hackneyW = 0, peabodyW = 0, otherW = 0;

                weekJobs.forEach(job => {
                    const cost = calculateNetJobCost(job).totalNet;
                    totalW += cost;
                    if (job.isHackney) hackneyW += cost;
                    else if (job.isPeabody) peabodyW += cost;
                    else otherW += cost;
                });

                const groupDiv = document.createElement('div');
                groupDiv.className = 'mb-6 shadow-lg rounded-xl overflow-hidden border border-gray-200';
                groupDiv.innerHTML = `
                        <div class="bg-indigo-700 text-white p-4">
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="font-bold text-lg">${formatWeekRange(week)} (${weekJobs.length} Jobs)</h3>
                                <span class="bg-white text-indigo-900 px-3 py-1 rounded-full font-black text-sm">TOTAL: ${formatCurrency(totalW)}</span>
                            </div>
                            <div class="grid grid-cols-3 gap-2 text-[10px] font-bold uppercase mb-3">
                                <div class="bg-blue-800 p-2 rounded border border-blue-400">Hackney: ${formatCurrency(hackneyW)}</div>
                                <div class="bg-red-800 p-2 rounded border border-red-400">Peabody: ${formatCurrency(peabodyW)}</div>
                                <div class="bg-gray-800 p-2 rounded border border-gray-400">Other: ${formatCurrency(otherW)}</div>
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t border-indigo-500">
                                 <button onclick="toggleWeekDisplay('${week}')" class="text-xs underline">Show/Hide Jobs</button>
                                 <button onclick="exportWeekData('${week}')" class="bg-green-500 px-4 py-1 rounded font-bold text-xs hover:bg-green-600">Export Week</button>
                            </div>
                        </div>
                        <div id="jobs-${week}" class="p-4 bg-white space-y-4" style="${searchTerm ? '' : 'display:none'}">
                            ${weekJobs.map(job => createJobCardHtml(job)).join('')}
                        </div>
                    `;
                container.appendChild(groupDiv);
            });
        };

        function createJobCardHtml(job) {
            const costs = calculateNetJobCost(job);
            const typeLabel = job.isHackney ? 'Hackney' : (job.isPeabody ? 'Peabody' : 'Other');
            return `
                    <div id="job-${job.id}" class="p-4 border rounded-lg bg-gray-50">
                        <div class="flex justify-between font-bold">
                            <span>${job.address} <span class="text-xs text-gray-400 font-normal">(${typeLabel})</span></span>
                            <span class="text-indigo-600">${formatCurrency(costs.totalNet)}</span>
                        </div>
                        <p class="text-sm text-gray-600 mt-1">${job.description || ''}</p>
                        <div class="mt-3 flex space-x-4 text-xs font-bold text-indigo-500">
                            <button onclick="editJob('${job.id}')">EDIT</button>
                            <button onclick="deleteJob('${job.id}')" class="text-red-400">DELETE</button>
                        </div>
                    </div>
                `;
        }

        window.toggleWeekDisplay = function (id) {
            const el = document.getElementById(`jobs-${id}`);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        };

        // ==========================================================
        // SECTION 5: CRUD & EDITING (FIXED JOB TYPES)
        // ==========================================================
        window.addJob = async function (e) {
            e.preventDefault();
            const form = e.target;
            const selectedType = form.querySelector('input[name="jobType"]:checked')?.value;
            const data = {
                title: form.elements['jobAddress'].value.trim(),
                address: form.elements['jobAddress'].value.trim(),
                description: form.elements['jobDescription'].value.trim(),
                labourPrice: parseFloat(form.elements['labourPrice'].value) || 0,
                materialPrice: parseFloat(form.elements['materialPrice'].value) || 0,
                isHackney: selectedType === 'hackney',
                isPeabody: selectedType === 'peabody',
                dateCompleted: form.elements['dateCompleted'].value,
                timestamp: Date.now()
            };
            await setDoc(doc(getJobsCollectionRef()), data);
            form.reset();
        };

        window.deleteJob = async function (id) { if (confirm('Delete?')) await deleteDoc(doc(getJobsCollectionRef(), id)); };

        window.editJob = function (id) {
            const job = allJobs.find(j => j.id === id);
            const div = document.getElementById(`job-${id}`);
            div.innerHTML = `
                    <form onsubmit="saveEdit(event, '${id}')" id="editForm-${id}" class="space-y-3">
                        <input type="text" id="editAddr-${id}" class="w-full border p-2 rounded" value="${job.address}">
                        <div class="flex gap-2">
                            <input type="number" step="0.01" id="editLab-${id}" class="w-1/2 border p-2 rounded" value="${job.labourPrice}">
                            <input type="number" step="0.01" id="editMat-${id}" class="w-1/2 border p-2 rounded" value="${job.materialPrice}">
                        </div>
                        <div class="flex gap-4 text-sm font-bold text-gray-700 py-1">
                            <label class="flex items-center"><input type="radio" name="editType-${id}" value="hackney" ${job.isHackney ? 'checked' : ''} class="mr-1"> Hackney</label>
                            <label class="flex items-center"><input type="radio" name="editType-${id}" value="peabody" ${job.isPeabody ? 'checked' : ''} class="mr-1"> Peabody</label>
                            <label class="flex items-center"><input type="radio" name="editType-${id}" value="other" ${(!job.isHackney && !job.isPeabody) ? 'checked' : ''} class="mr-1"> Other</label>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white p-2 rounded font-bold">Save Changes</button>
                        <button type="button" onclick="renderJobs()" class="w-full text-gray-400 text-xs">Cancel</button>
                    </form>
                `;
        };

        window.saveEdit = async function (e, id) {
            e.preventDefault();
            const selectedType = document.querySelector(`input[name="editType-${id}"]:checked`)?.value;
            const updated = {
                address: document.getElementById(`editAddr-${id}`).value,
                labourPrice: parseFloat(document.getElementById(`editLab-${id}`).value),
                materialPrice: parseFloat(document.getElementById(`editMat-${id}`).value),
                isHackney: selectedType === 'hackney',
                isPeabody: selectedType === 'peabody'
            };
            await setDoc(doc(getJobsCollectionRef(), id), updated, { merge: true });
        };

        // ==========================================================
        // SECTION 6: EXPORT (WORD + EXCEL)
        // ==========================================================
        window.generateXLSX = function (jobs, invoiceNumber) {
            if (!jobs || jobs.length === 0) return;

            // 1. Map data to your specific Excel headers
            const excelData = jobs.map(job => {
                const costs = calculateNetJobCost(job);
                return {
                    Address: job.address || job.title,
                    Code: "", // Empty as per your requested layout
                    Labour: costs.grossLabour,
                    Materials: costs.material,
                    Description: job.description || ""
                };
            });

            const headers = ["Address", "Code", "Labour", "Materials", "Description"];

            // 2. Create worksheet
            const worksheet = XLSX.utils.json_to_sheet(excelData, {
                header: headers,
                skipHeader: false
            });

            if (!worksheet['!ref']) return;

            let range = XLSX.utils.decode_range(worksheet['!ref']);
            const currencyFormat = '£#,##0.00';

            // Helper to set text in summary cells
            const setCellText = (ws, c, r, text) => {
                const cellRef = XLSX.utils.encode_cell({ c: c, r: r });
                ws[cellRef] = { v: text, t: 's' };
            };

            let totalLabourSum = 0;
            let totalMaterialsSum = 0;

            // 3. Format rows and calculate sums for the footer
            for (let R = range.s.r + 1; R <= range.e.r; ++R) {
                const labourCellRef = XLSX.utils.encode_cell({ c: 2, r: R });
                const matCellRef = XLSX.utils.encode_cell({ c: 3, r: R });

                if (worksheet[labourCellRef]) {
                    worksheet[labourCellRef].z = currencyFormat;
                    totalLabourSum += (parseFloat(worksheet[labourCellRef].v) || 0);
                }
                if (worksheet[matCellRef]) {
                    worksheet[matCellRef].z = currencyFormat;
                    totalMaterialsSum += (parseFloat(worksheet[matCellRef].v) || 0);
                }
            }

            // 4. Create Grand Totals Summary at the bottom
            const titleRowIndex = range.e.r + 2;
            const valueRowIndex = range.e.r + 3;
            const finalTotalSum = totalLabourSum + totalMaterialsSum;

            setCellText(worksheet, 2, titleRowIndex, 'Total Labour');
            setCellText(worksheet, 3, titleRowIndex, 'Total Materials');
            setCellText(worksheet, 4, titleRowIndex, 'Final Total');

            setCellText(worksheet, 0, valueRowIndex, 'GRAND TOTALS');

            worksheet[XLSX.utils.encode_cell({ c: 2, r: valueRowIndex })] = { t: 'n', v: totalLabourSum, z: currencyFormat };
            worksheet[XLSX.utils.encode_cell({ c: 3, r: valueRowIndex })] = { t: 'n', v: totalMaterialsSum, z: currencyFormat };
            worksheet[XLSX.utils.encode_cell({ c: 4, r: valueRowIndex })] = { t: 'n', v: finalTotalSum, z: currencyFormat };

            // Expand range to include summary
            range.e.r = valueRowIndex;
            worksheet['!ref'] = XLSX.utils.encode_range(range);

            // 5. Auto-adjust Column Widths (Max 50 characters)
            const wscols = headers.map((header, colIndex) => {
                let maxLen = header.length;
                for (let R = range.s.r; R <= range.e.r; ++R) {
                    const cell = worksheet[XLSX.utils.encode_cell({ c: colIndex, r: R })];
                    if (cell && cell.v) {
                        const len = String(cell.v).length;
                        if (len > maxLen) maxLen = len;
                    }
                }
                return { wch: Math.min(maxLen + 2, 50) };
            });
            worksheet['!cols'] = wscols;

            // 6. Generate File
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `Jobs`);
            const safeInvoiceNumber = invoiceNumber.replace(/[^a-zA-Z0-9_]/g, '.');
            XLSX.writeFile(workbook, `${safeInvoiceNumber}.xlsx`);
        };

        window.exportWeekData = async function (week) {
            const jobs = allJobs.filter(j => getWeekStartDate(j.dateCompleted) === week);
            const peabody = jobs.filter(j => j.isPeabody);
            const saltash = jobs.filter(j => !j.isPeabody);

            let fbMinor = freshbuildLastMinor, saMinor = saltashLastMinor;

            if (peabody.length > 0) {
                fbMinor++;
                const inv = `FB_${INVOICE_MAJOR_NUMBER}.${String(fbMinor).padStart(2, '0')}`;
                if (await window.generateDocxInvoice('Freshbuild', aggregateInvoiceData(peabody, inv))) {
                    window.generateXLSX(peabody, inv);
                }
            }
            if (saltash.length > 0) {
                saMinor++;
                const inv = `${INVOICE_MAJOR_NUMBER}.${String(saMinor).padStart(2, '0')}`;
                if (await window.generateDocxInvoice('Saltash', aggregateInvoiceData(saltash, inv))) {
                    window.generateXLSX(saltash, inv);
                }
            }

            await saveInvoiceNumbers(INVOICE_MAJOR_NUMBER, fbMinor, saMinor);
            alert("Export complete. Check downloads for both Word and Excel files.");
        };

        window.generateDocxInvoice = async function (client, data) {
            try {
                const response = await fetch(`ClientInvoiceBlank.docx`);
                const content = await response.arrayBuffer();
                const zip = new PizZip(content);
                const docInst = new Docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
                docInst.render({ ...data, CLIENT_NAME_FULL: CLIENT_DATA[client.toUpperCase()].name, CLIENT_ADDRESS: CLIENT_DATA[client.toUpperCase()].address });
                const out = docInst.getZip().generate({ type: "blob" });
                saveAs(out, `${data.INVOICE_NUMBER}.docx`);
                return true;
            } catch (e) { alert("Word Template Error: Ensure 'ClientInvoiceBlank.docx' is in the same folder."); return false; }
        };

        window.onload = initFirebase;
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-2">Job Manager & Invoice Generator</h1>
        <p id="authStatus" class="text-sm text-gray-600 mb-6">Status: Initializing...</p>
        <p > Version 1.2 </p>

        <div class="bg-white p-6 rounded-xl shadow-2xl mb-8 border-t-4 border-indigo-600">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Add New Job</h2>
            <form id="addJobForm" onsubmit="addJob(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="jobAddress" class="block text-sm font-medium text-gray-700">Job Address / Title</label>
                        <input type="text" id="jobAddress" name="jobAddress" required class="input-field">
                    </div>
                    <div>
                        <label for="dateCompleted" class="block text-sm font-medium text-gray-700">Date Completed</label>
                        <input type="date" id="dateCompleted" name="dateCompleted" class="input-field">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="labourPrice" class="block text-sm font-medium text-gray-700">Labour Price (£)</label>
                        <input type="number" id="labourPrice" name="labourPrice" step="0.01" placeholder="0.00" class="input-field" value="">
                    </div>
                    <div>
                        <label for="materialPrice" class="block text-sm font-medium text-gray-700">Material Price (£)</label>
                        <input type="number" id="materialPrice" name="materialPrice" step="0.01" placeholder="0.00" class="input-field" value="">
                    </div>
                </div>

                <div>
                    <label for="jobDescription" class="block text-sm font-medium text-gray-700">Detailed Description</label>
                    <textarea id="jobDescription" name="jobDescription" rows="3" class="input-field"></textarea>
                </div>

                <div class="space-y-2">
                    <span class="block text-sm font-medium text-gray-700">Job Type (Required for invoicing):</span>
                    <div class="flex space-x-6">
                        <div class="flex items-center">
                            <input id="jobType-hackney" type="radio" name="jobType" value="hackney" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500" onclick="handleRadioClick(event)">
                            <label for="jobType-hackney" class="ml-2 block text-sm font-medium text-gray-700">Hackney (Saltash)</label>
                        </div>
                        <div class="flex items-center">
                            <input id="jobType-peabody" type="radio" name="jobType" value="peabody" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500" onclick="handleRadioClick(event)">
                            <label for="jobType-peabody" class="ml-2 block text-sm font-medium text-gray-700">Peabody (Freshbuild)</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-indigo-700 transition duration-150 ease-in-out">Add Job</button>
            </form>
        </div>

        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Completed Jobs By Week</h2>

        <div class="relative mb-6">
            <input type="text" id="jobSearch" oninput="renderJobs()" placeholder="Search by address, description, or price..." class="input-field pl-10 bg-white">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <div id="loadingIndicator" class="text-center py-8" style="display:none;">
            <svg class="animate-spin h-8 w-8 text-indigo-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-sm text-indigo-500 mt-2">Loading job data...</p>
        </div>

        <div id="jobList" class="space-y-6">
        </div>

    </div>
</body>
</html>
