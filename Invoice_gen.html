<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Manager (Cloud Shared)</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .input-field {
            @apply mt-1 block w-full p-3 rounded-lg shadow-xl focus:ring-indigo-500 focus:border-indigo-500;
            border: 3px solid #000000;
            width: 100%;
        }
        input[type="radio"] { border: 2px solid #000000; }
        .jobs-container:not([style*="display: none"]) + .week-group .rotate-180 {
            transform: rotate(0deg) !important;
        }
    </style>

    <script type="module">
        import PizZip from "https://esm.sh/pizzip@3.1.6";
        import Docxtemplater from "https://esm.sh/docxtemplater";
        import saveAs from "https://esm.sh/file-saver";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, orderBy, limit, deleteDoc, setLogLevel, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        setLogLevel('debug');

        const LABOUR_TAX_RATE = 0.20;
        const LABOUR_AFTER_TAX_MULTIPLIER = 0.80;
        const DB_COLLECTION = 'jobs';
        const INVOICE_NUMBERS_DOC_PATH = 'invoice_config/current_numbers';

        let app, db, auth, userId = null, allJobs = [], isAuthReady = false, areInvoiceNumbersLoaded = false;
        let INVOICE_MAJOR_NUMBER = 0, saltashLastMinor = 0, freshbuildLastMinor = 0;

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAX7GYX247S69b6blLBcja-_IHU6Y9i3hI",
            authDomain: "tools-9bf35.firebaseapp.com",
            projectId: "tools-9bf35",
            storageBucket: "tools-9bf35.firebasestorage.app",
            messagingSenderId: "803649385600",
            appId: "1:803649385600:web:79fc8ed25d35ebdf032265"
        };

        const appId = FIREBASE_CONFIG.projectId;

        const CLIENT_DATA = {
            FRESHBUILD: { name: 'FRESHBUILD LIMITED', address: 'SHALIMER, CRICKET GROUND RD\nCHISLEHURST\nKENT\nBR7 5HD' },
            SALTASH: { name: 'SALTASH ENTERPRISES LIMITED', address: '110- 116 ORMSIDE STREET\nLONDON, SE15 1TF' }
        };

        function getJobsCollectionRef() { return collection(db, `artifacts/${appId}/public/data/${DB_COLLECTION}`); }
        function getInvoiceConfigDocRef() { return doc(db, `artifacts/${appId}/public/data/${INVOICE_NUMBERS_DOC_PATH}`); }

        async function initFirebase() {
            const statusDisplay = document.getElementById('authStatus');
            const loadingIndicator = document.getElementById('loadingIndicator');
            try {
                if (!app) {
                    app = initializeApp(FIREBASE_CONFIG);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    // READ OPTIMIZATION: Use local cache
                    try { await enableIndexedDbPersistence(db); } catch (err) { console.warn("Persistence failed", err.code); }
                    await setPersistence(auth, browserLocalPersistence);
                }
                statusDisplay.textContent = 'Authenticating...';
                loadingIndicator.style.display = 'block';
                await signInAnonymously(auth);
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        statusDisplay.textContent = `Status: Authenticated (User ID: ${userId.substring(0, 8)}...)`;
                        if (!isAuthReady) {
                            isAuthReady = true;
                            // READ OPTIMIZATION: Fetch config once instead of listening
                            await fetchConfigOnce();
                            setupJobsListener();
                        }
                    }
                });
            } catch (error) {
                statusDisplay.textContent = `Error: ${error.message}`;
            }
        }

        async function fetchConfigOnce() {
            const docSnap = await getDoc(getInvoiceConfigDocRef());
            if (docSnap.exists()) {
                const data = docSnap.data();
                INVOICE_MAJOR_NUMBER = data.majorNumber || 25;
                freshbuildLastMinor = data.freshbuildMinor || 0;
                saltashLastMinor = data.saltashMinor || 0;
            } else {
                INVOICE_MAJOR_NUMBER = 25;
            }
            areInvoiceNumbersLoaded = true;
        }

        function setupJobsListener() {
            // READ OPTIMIZATION: Limit query to 100 most recent jobs
            const jobsQuery = query(getJobsCollectionRef(), orderBy("date", "desc"), limit(100));
            onSnapshot(jobsQuery, (snapshot) => {
                allJobs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('loadingIndicator').style.display = 'none';
                renderJobs();
            });
        }

        // --- ALL ORIGINAL FUNCTIONS (formatCurrency, calculateNetJobCost, getWeekStartDate, etc.) ---
        function formatCurrency(value) {
            const num = parseFloat(value);
            return isNaN(num) ? '£0.00' : '£' + num.toFixed(2);
        }

        function calculateNetJobCost(job) {
            const labour = parseFloat(job.labourPrice) || 0;
            const material = parseFloat(job.materialPrice) || 0;
            return { grossLabour: labour, netLabour: labour * LABOUR_AFTER_TAX_MULTIPLIER, material: material, totalNet: (labour * LABOUR_AFTER_TAX_MULTIPLIER) + material };
        }

        function getWeekStartDate(dateString) {
            if (!dateString) return 'Unscheduled';
            const date = new Date(dateString + 'T00:00:00');
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff)).toISOString().split('T')[0];
        }

        function formatWeekRange(dateString) {
            if (dateString === 'Unscheduled') return 'Unscheduled Jobs';
            const start = new Date(dateString + 'T00:00:00');
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            const fmt = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            return `Week of ${fmt.format(start)} – ${fmt.format(end)}`;
        }

        window.saveJob = async function() {
            const clientType = document.querySelector('input[name="clientType"]:checked')?.value;
            const address = document.getElementById('jobAddress').value;
            const description = document.getElementById('jobDescription').value;
            const date = document.getElementById('jobDate').value;
            const labourPrice = document.getElementById('labourPrice').value;
            const materialPrice = document.getElementById('materialPrice').value;

            if (!clientType || !address || !date) return alert("Fill in Client, Address, and Date.");

            const jobData = { clientType, address, description, date, labourPrice, materialPrice, createdAt: new Date().toISOString() };
            try {
                await setDoc(doc(getJobsCollectionRef()), jobData);
                document.getElementById('jobForm').reset();
            } catch (e) { alert("Error: " + e.message); }
        };

        window.renderJobs = function() {
            const container = document.getElementById('jobsByWeek');
            const search = document.getElementById('jobSearch').value.toLowerCase();
            container.innerHTML = '';

            const filtered = allJobs.filter(j => j.address.toLowerCase().includes(search) || j.description.toLowerCase().includes(search));
            const grouped = filtered.reduce((acc, j) => {
                const w = getWeekStartDate(j.date);
                if (!acc[w]) acc[w] = [];
                acc[w].push(j);
                return acc;
            }, {});

            Object.keys(grouped).sort().reverse().forEach(week => {
                const weekSection = document.createElement('div');
                weekSection.className = 'mb-8 bg-white rounded-xl shadow-lg border-2 border-black overflow-hidden';
                weekSection.innerHTML = `
                    <div class="week-group bg-gray-200 p-4 border-b-2 border-black flex justify-between items-center cursor-pointer">
                        <h3 class="text-xl font-bold text-gray-800">${formatWeekRange(week)}</h3>
                        <svg class="w-6 h-6 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div class="jobs-container p-4 space-y-4"></div>
                `;
                const jobsDiv = weekSection.querySelector('.jobs-container');
                grouped[week].forEach(job => {
                    const card = document.createElement('div');
                    card.className = 'p-4 border-2 border-black rounded-lg bg-gray-50';
                    card.innerHTML = `<div class="flex justify-between font-bold"><span>${job.address}</span><span>${formatCurrency(calculateNetJobCost(job).totalNet)}</span></div>`;
                    jobsDiv.appendChild(card);
                });
                container.appendChild(weekSection);
            });
        };

        window.onload = initFirebase;
    </script>
</head>
<body class="bg-gray-100 p-4 pb-20">
    <div class="max-w-4xl mx-auto">
        <div id="authStatus" class="text-sm font-mono mb-4 text-gray-600">Initialising...</div>
        <div class="bg-white p-6 rounded-xl shadow-lg border-4 border-black mb-8">
            <h2 class="text-3xl font-black mb-6 uppercase tracking-tight">Add New Job</h2>
            <form id="jobForm" onsubmit="event.preventDefault();">
                <div class="flex flex-wrap gap-6 mb-6 p-4 bg-gray-50 border-2 border-black rounded-lg">
                    <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="clientType" value="FRESHBUILD" class="w-6 h-6"> <span class="font-bold">Freshbuild</span></label>
                    <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="clientType" value="SALTASH" class="w-6 h-6"> <span class="font-bold">Saltash</span></label>
                </div>
                <input type="text" id="jobAddress" placeholder="Site Address" class="input-field mb-4 font-bold">
                <textarea id="jobDescription" placeholder="Description" class="input-field mb-4"></textarea>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div><label class="block text-xs font-black uppercase mb-1">Date</label><input type="date" id="jobDate" class="input-field"></div>
                    <div><label class="block text-xs font-black uppercase mb-1">Labour (£)</label><input type="number" id="labourPrice" class="input-field"></div>
                    <div><label class="block text-xs font-black uppercase mb-1">Material (£)</label><input type="number" id="materialPrice" class="input-field"></div>
                </div>
                <button onclick="saveJob()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-xl border-b-8 border-indigo-900 active:border-b-0 uppercase">Add Job</button>
            </form>
        </div>
        <div id="loadingIndicator" style="display:none;" class="text-center font-bold py-10">LOADING JOBS...</div>
        <div class="relative mb-8"><input type="text" id="jobSearch" oninput="renderJobs()" placeholder="Search..." class="input-field pl-12 font-bold bg-white border-4 border-black shadow-2xl"></div>
        <div id="jobsByWeek"></div>
    </div>
</body>
</html>
