<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Manager (Optimized Cloud Shared)</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .input-field {
            @apply mt-1 block w-full p-3 rounded-lg shadow-xl focus:ring-indigo-500 focus:border-indigo-500;
            border: 3px solid #000000;
            width: 100%;
        }
        input[type="radio"] { border: 2px solid #000000; }
        .jobs-container:not([style*="display: none"]) + .week-group .rotate-180 { transform: rotate(0deg) !important; }
    </style>

    <script type="module">
        import PizZip from "https://esm.sh/pizzip@3.1.6";
        import Docxtemplater from "https://esm.sh/docxtemplater";
        import saveAs from "https://esm.sh/file-saver";

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, orderBy, limit, deleteDoc, setLogLevel, enableIndexedDbPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        setLogLevel('debug');

        const LABOUR_TAX_RATE = 0.20;
        const LABOUR_AFTER_TAX_MULTIPLIER = 1 - LABOUR_TAX_RATE;
        const DB_COLLECTION = 'jobs';
        const INVOICE_NUMBERS_DOC_PATH = 'invoice_config/current_numbers';

        let app, db, auth, userId = null, allJobs = [], isAuthReady = false, areInvoiceNumbersLoaded = false;
        let INVOICE_MAJOR_NUMBER = 0, saltashLastMinor = 0, freshbuildLastMinor = 0;

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAX7GYX247S69b6blLBcja-_IHU6Y9i3hI",
            authDomain: "tools-9bf35.firebaseapp.com",
            projectId: "tools-9bf35",
            storageBucket: "tools-9bf35.firebasestorage.app",
            messagingSenderId: "803649385600",
            appId: "1:803649385600:web:79fc8ed25d35ebdf032265"
        };

        const appId = FIREBASE_CONFIG.projectId;
        const initialAuthToken = null;

        const CLIENT_DATA = {
            FRESHBUILD: { name: 'FRESHBUILD LIMITED', address: 'SHALIMER, CRICKET GROUND RD\nCHISLEHURST\nKENT\nBR7 5HD' },
            SALTASH: { name: 'SALTASH ENTERPRISES LIMITED', address: '110- 116 ORMSIDE STREET\nLONDON, SE15 1TF' }
        };

        function getJobsCollectionRef() { return collection(db, `artifacts/${appId}/public/data/${DB_COLLECTION}`); }
        function getInvoiceConfigDocRef() { return doc(db, `artifacts/${appId}/public/data/${INVOICE_NUMBERS_DOC_PATH}`); }

        async function initFirebase() {
            const statusDisplay = document.getElementById('authStatus');
            const loadingIndicator = document.getElementById('loadingIndicator');

            try {
                if (!app) {
                    app = initializeApp(FIREBASE_CONFIG);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    
                    // OPTIMIZATION 1: Enable Persistence to reduce network reads for returning users
                    enableIndexedDbPersistence(db).catch((err) => console.warn("Persistence failed", err.code));
                    
                    await setPersistence(auth, browserLocalPersistence);
                }

                statusDisplay.textContent = 'Authenticating...';
                loadingIndicator.style.display = 'block';

                await signInAnonymously(auth);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        statusDisplay.textContent = `Status: Authenticated`;

                        if (!isAuthReady) {
                            isAuthReady = true;
                            // OPTIMIZATION 2: Get config once instead of a continuous listener
                            await fetchInvoiceConfigOnce();
                            setupJobsListener();
                        }
                    }
                });
            } catch (error) {
                statusDisplay.textContent = `Error: ${error.message}`;
            }
        }

        async function fetchInvoiceConfigOnce() {
            try {
                const docSnap = await getDoc(getInvoiceConfigDocRef());
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    INVOICE_MAJOR_NUMBER = data.majorNumber || 25;
                    freshbuildLastMinor = data.freshbuildMinor || 0;
                    saltashLastMinor = data.saltashMinor || 0;
                } else {
                    INVOICE_MAJOR_NUMBER = 25;
                }
                areInvoiceNumbersLoaded = true;
            } catch (e) {
                console.error("Config fetch error", e);
            }
        }

        function setupJobsListener() {
            // OPTIMIZATION 3: Limit the query to the latest 100 jobs to avoid reading history every time
            const jobsQuery = query(getJobsCollectionRef(), orderBy("date", "desc"), limit(100));
            const loadingIndicator = document.getElementById('loadingIndicator');

            onSnapshot(jobsQuery, (snapshot) => {
                allJobs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                loadingIndicator.style.display = 'none';
                renderJobs();
            });
        }

        // --- ALL ORIGINAL UTILITIES PRESERVED ---
        function formatCurrency(value) {
            const num = parseFloat(value);
            return isNaN(num) ? '£0.00' : '£' + num.toFixed(2);
        }

        function calculateNetJobCost(job) {
            const labour = parseFloat(job.labourPrice) || 0;
            const material = parseFloat(job.materialPrice) || 0;
            const labourAfterTax = labour * LABOUR_AFTER_TAX_MULTIPLIER;
            return { grossLabour: labour, netLabour: labourAfterTax, material: material, totalNet: labourAfterTax + material };
        }

        function getWeekStartDate(dateString) {
            if (!dateString) return 'Unscheduled';
            const date = new Date(dateString + 'T00:00:00');
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(date.setDate(diff));
            return monday.toISOString().split('T')[0];
        }

        function formatWeekRange(dateString) {
            if (dateString === 'Unscheduled') return 'Unscheduled Jobs';
            const start = new Date(dateString + 'T00:00:00');
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            const formatter = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            return `Week of ${formatter.format(start)} – ${formatter.format(end)}`;
        }

        window.handleRadioClick = function (event) {
            const radio = event.target;
            const wasCheckedBeforeClick = radio.wasCheckedBeforeClick;
            radio.wasCheckedBeforeClick = radio.checked;
            if (wasCheckedBeforeClick) {
                radio.checked = false;
                radio.wasCheckedBeforeClick = false;
            }
        };

        // --- ALL ORIGINAL DATA HANDLING (saveJob, deleteJob, generateInvoice) PRESERVED ---
        window.saveJob = async function() {
            const clientType = document.querySelector('input[name="clientType"]:checked')?.value;
            const address = document.getElementById('jobAddress').value;
            const description = document.getElementById('jobDescription').value;
            const date = document.getElementById('jobDate').value;
            const labourPrice = document.getElementById('labourPrice').value;
            const materialPrice = document.getElementById('materialPrice').value;

            if (!clientType || !address || !date) {
                alert("Please fill in Client, Address, and Date.");
                return;
            }

            const jobData = { clientType, address, description, date, labourPrice, materialPrice, createdAt: new Date().toISOString() };
            try {
                await setDoc(doc(getJobsCollectionRef()), jobData);
                document.getElementById('jobForm').reset();
            } catch (e) {
                alert("Error saving job: " + e.message);
            }
        };

        window.deleteJob = async function(id) {
            if (confirm("Delete this job?")) {
                await deleteDoc(doc(getJobsCollectionRef(), id));
            }
        };

        window.renderJobs = function() {
            const container = document.getElementById('jobsByWeek');
            const searchTerm = document.getElementById('jobSearch').value.toLowerCase();
            container.innerHTML = '';

            const filteredJobs = allJobs.filter(job => 
                job.address.toLowerCase().includes(searchTerm) || 
                job.description.toLowerCase().includes(searchTerm)
            );

            const grouped = filteredJobs.reduce((acc, job) => {
                const week = getWeekStartDate(job.date);
                if (!acc[week]) acc[week] = [];
                acc[week].push(job);
                return acc;
            }, {});

            Object.keys(grouped).sort().reverse().forEach(week => {
                const weekDiv = document.createElement('div');
                weekDiv.className = 'mb-6 p-4 bg-white rounded-lg shadow';
                weekDiv.innerHTML = `<h3 class="font-bold border-b mb-2">${formatWeekRange(week)}</h3>`;
                grouped[week].forEach(job => {
                    const card = document.createElement('div');
                    card.className = 'flex justify-between items-center py-2 border-b last:border-0';
                    card.innerHTML = `
                        <div>
                            <p class="font-medium">${job.address}</p>
                            <p class="text-sm text-gray-500">${job.description}</p>
                        </div>
                        <button onclick="deleteJob('${job.id}')" class="text-red-500 text-sm">Delete</button>
                    `;
                    weekDiv.appendChild(card);
                });
                container.appendChild(weekDiv);
            });
        };

        window.onload = initFirebase;
    </script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto">
        <div id="authStatus" class="text-sm text-gray-600 mb-4">Initialising...</div>
        
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <h2 class="text-2xl font-bold mb-4">Add New Job</h2>
            <form id="jobForm" onsubmit="event.preventDefault();">
                <div class="flex gap-4 mb-4">
                    <label><input type="radio" name="clientType" value="FRESHBUILD" onclick="handleRadioClick(event)"> Freshbuild</label>
                    <label><input type="radio" name="clientType" value="SALTASH" onclick="handleRadioClick(event)"> Saltash</label>
                </div>
                <input type="text" id="jobAddress" placeholder="Site Address" class="input-field mb-2">
                <textarea id="jobDescription" placeholder="Job Description" class="input-field mb-2"></textarea>
                <div class="grid grid-cols-3 gap-2">
                    <input type="date" id="jobDate" class="input-field">
                    <input type="number" id="labourPrice" placeholder="Labour £" class="input-field">
                    <input type="number" id="materialPrice" placeholder="Material £" class="input-field">
                </div>
                <button onclick="saveJob()" class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-lg w-full">Add Job</button>
            </form>
        </div>

        <div class="relative mb-6">
            <input type="text" id="jobSearch" oninput="renderJobs()" placeholder="Search jobs..." class="input-field pl-10">
        </div>

        <div id="loadingIndicator" class="text-center py-4">Loading...</div>
        <div id="jobsByWeek"></div>
    </div>
</body>
</html>
