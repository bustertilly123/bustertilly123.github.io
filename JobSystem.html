<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Booker & Search Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
        }
        h1, h2 { color: #ffffff; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 0; }
        h2 { font-size: 20px; margin-bottom: 15px; }
        
        .dashboard {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .left-panel { flex: 1; max-width: 450px; }
        .right-panel { flex: 2; display: flex; flex-direction: column; gap: 20px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #cccccc; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #1e1e1e;
            border: 1px solid #444;
            color: #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus { border-color: #0284c7; outline: none; }
        
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { background-color: #0369a1; }
        .btn:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        
        .search-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-search { width: auto; padding: 10px 25px; }

        #status_msg, #search_status { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; }
        .success { background-color: #065f46; color: #34d399; }
        .error { background-color: #881337; color: #fca5a5; }
        
        .auth-panel, .panel-box {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #0284c7;
        }

        /* Search Results Styles */
        .results-list { max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .job-card {
            background: #252525;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 1px solid #383838;
        }
        .job-card-header { display: flex; justify-content: space-between; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .job-meta { font-size: 13px; color: #0284c7; display: flex; gap: 15px; }
        .job-notes { font-size: 13px; color: #aaa; margin-top: 6px; font-style: italic; }
        .price-tag { color: #34d399; font-weight: bold; }
        
        .calendar-wrapper { flex-grow: 1; min-height: 450px; }
        iframe { width: 100%; height: 100%; border: 1px solid #333; border-radius: 8px; background-color: #1e1e1e; }

        @media (max-width: 900px) {
            .dashboard { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        
        <div class="left-panel">
            <h1>Book New Job</h1>

            <div class="auth-panel" id="system_status">
                <p style="margin: 0 0 5px 0; font-weight: bold;">Connection Status:</p>
                <div id="gapi_state">⏳ Loading Google Core Scripts...</div>
            </div>

            <div class="auth-panel" id="auth_section" style="display: none;">
                <p style="margin-top: 0;">Session expired or disconnected. Please sign in:</p>
                <button class="btn" id="auth_btn" onclick="handleAuthClick()">Connect Google Calendar</button>
            </div>

            <form id="job_form" onsubmit="submitJobToCalendar(event)" style="opacity: 0.3; pointer-events: none;">
                <div class="form-group">
                    <label for="job_location">Site Address (Calendar Title)</label>
                    <input type="text" id="job_location" placeholder="e.g., 123 High St, Bromley" required>
                </div>

                <div class="form-group">
                    <label for="job_type">Job / Invoice Type</label>
                    <select id="job_type">
                        <option value="Domestic">Domestic Template</option>
                        <option value="Commercial">Commercial Template</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="job_price">Quoted Price (£)</label>
                    <input type="number" id="job_price" placeholder="e.g., 450" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="job_notes">Job Notes / Materials</label>
                    <textarea id="job_notes" rows="4" placeholder="List notes here..."></textarea>
                </div>

                <button type="submit" class="btn" id="submit_btn">Add Job to Calendar</button>
            </form>

            <div id="status_msg"></div>
        </div>

        <div class="right-panel">
            
            <div class="panel-box" id="search_panel" style="opacity: 0.3; pointer-events: none;">
                <h2>Search Job History</h2>
                <div class="search-row">
                    <input type="text" id="search_query" placeholder="Type address, keywords, or customer details...">
                    <button class="btn btn-search" onclick="searchCalendarJobs()">Search</button>
                </div>
                <div id="search_status"></div>
                <div class="results-list" id="search_results"></div>
            </div>

            <div class="calendar-wrapper">
                <iframe id="calendar_frame" src="https://calendar.google.com/calendar/embed?src=bustertilly123%40gmail.com&ctz=Europe%2FLondon&wkst=2&mode=WEEK&showPrint=0&showTabs=0&showCalendars=0&showTz=0&bgcolor=%231e1e1e"></iframe>
            </div>

        </div>

    </div>

    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

    <script>
        const CLIENT_ID = '207281748804-ajuenjdl9s6surn2hgep5iuccccfls9d.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyCIUMy-DB9QbvVc2YaVnwrzaq0e7trJGuc';
        
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events';

        let gapiInited = false;
        let gisInited = false;
        let tokenClient;

        function checkExistingToken() {
            const savedTokenString = localStorage.getItem('google_cal_token');
            if (savedTokenString) {
                const tokenData = JSON.parse(savedTokenString);
                if (Date.now() < tokenData.expiry) {
                    gapi.client.setToken({ access_token: tokenData.access_token });
                    unlockForm();
                    return true;
                } else {
                    localStorage.removeItem('google_cal_token'); 
                }
            }
            return false;
        }

        function unlockForm() {
            document.getElementById('system_status').style.display = 'none';
            document.getElementById('auth_section').style.display = 'none';
            
            // Unlock both the booking form and the search panel
            document.getElementById('job_form').style.opacity = '1';
            document.getElementById('job_form').style.pointerEvents = 'auto';
            document.getElementById('search_panel').style.opacity = '1';
            document.getElementById('search_panel').style.pointerEvents = 'auto';
        }

        function gapiLoaded() {
            gapi.load('client', () => {
                gapi.client.init({ apiKey: API_KEY, discoveryDocs: [DISCOVERY_DOC] }).then(() => {
                    gapiInited = true;
                    checkInitStatus();
                });
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', 
            });
            gisInited = true;
            checkInitStatus();
        }
        
        function checkInitStatus() {
            if (gapiInited && gisInited) {
                if (checkExistingToken()) return; 
                document.getElementById('system_status').style.display = 'none';
                document.getElementById('auth_section').style.display = 'block';
            }
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) throw (resp);
                const tokenSession = {
                    access_token: resp.access_token,
                    expiry: Date.now() + (55 * 60 * 1000) 
                };
                localStorage.setItem('google_cal_token', JSON.stringify(tokenSession));
                unlockForm();
            };
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        // ─── SEARCH FUNCTIONALITY ──────────────────────────────────────────
        function searchCalendarJobs() {
            const query = document.getElementById('search_query').value.trim();
            const resultsContainer = document.getElementById('search_results');
            const searchStatus = document.getElementById('search_status');
            
            resultsContainer.innerHTML = '';
            if (!query) {
                searchStatus.style.display = 'none';
                return;
            }

            searchStatus.className = 'success';
            searchStatus.style.backgroundColor = '#1e3a8a';
            searchStatus.style.color = '#93c5fd';
            searchStatus.innerHTML = '🔍 Querying database history...';
            searchStatus.style.display = 'block';

            // Call list endpoint filtering directly via text query parameter 'q'
            gapi.client.calendar.events.list({
                'calendarId': 'primary',
                'q': query,
                'maxResults': 25,
                'orderBy': 'startTime',
                'singleEvents': true
            }).then(response => {
                const events = response.result.items;
                searchStatus.style.display = 'none';

                if (!events || events.length === 0) {
                    resultsContainer.innerHTML = '<div style="color: #aaa; padding: 10px;">No matching historical records found.</div>';
                    return;
                }

                events.forEach(event => {
                    // Extract custom properties safely if they exist
                    const extended = event.extendedProperties?.private || {};
                    const price = extended.price ? `£${extended.price}` : 'No price set';
                    const type = extended.jobType ? `${extended.jobType} Template` : 'Standard Job';
                    
                    // Format human readable date from ISO stamp
                    const dateObj = new Date(event.start.dateTime || event.start.date);
                    const formattedDate = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                    const card = document.createElement('div');
                    card.className = 'job-card';
                    card.innerHTML = `
                        <div class="job-card-header">
                            <span>📍 ${event.summary}</span>
                            <span class="price-tag">${price}</span>
                        </div>
                        <div class="job-meta">
                            <span>📅 ${formattedDate}</span>
                            <span>📋 ${type}</span>
                        </div>
                        ${event.description ? `<div class="job-notes">${event.description}</div>` : ''}
                    `;
                    resultsContainer.appendChild(card);
                });
            }).catch(err => {
                searchStatus.className = 'error';
                searchStatus.innerHTML = 'Error querying calendar data: ' + err.result.error.message;
                searchStatus.style.display = 'block';
            });
        }

        // ─── BOOKING ENGINE ────────────────────────────────────────────────
        function submitJobToCalendar(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit_btn');
            const statusMsg = document.getElementById('status_msg');
            
            submitBtn.disabled = true;
            statusMsg.style.display = 'none';

            const type = document.getElementById('job_type').value;
            const price = document.getElementById('job_price').value;
            const location = document.getElementById('job_location').value;
            const notes = document.getElementById('job_notes').value;

            const startDateTime = new Date();
            const endDateTime = new Date(startDateTime.getTime() + (60 * 60 * 1000));

            const event = {
                'summary': location,
                'location': location,
                'description': notes,
                'start': { 'dateTime': startDateTime.toISOString(), 'timeZone': 'Europe/London' },
                'end': { 'dateTime': endDateTime.toISOString(), 'timeZone': 'Europe/London' },
                'extendedProperties': {
                    'private': { 'jobType': type, 'price': price }
                }
            };

            gapi.client.calendar.events.insert({
                'calendarId': 'primary',
                'resource': event
            }).then(response => {
                statusMsg.className = 'status_msg success';
                statusMsg.innerHTML = '<strong>Success!</strong> Job written to calendar.';
                statusMsg.style.display = 'block';
                
                document.getElementById('job_price').value = '';
                document.getElementById('job_location').value = '';
                document.getElementById('job_notes').value = '';
                submitBtn.disabled = false;

                document.getElementById('calendar_frame').src = document.getElementById('calendar_frame').src;
            }).catch(err => {
                statusMsg.className = 'status_msg error';
                statusMsg.innerHTML = '<strong>Error saving job:</strong> ' + err.result.error.message;
                statusMsg.style.display = 'block';
                submitBtn.disabled = false;
                
                if (err.status === 401) {
                    localStorage.removeItem('google_cal_token');
                    document.getElementById('auth_section').style.display = 'block';
                    document.getElementById('job_form').style.opacity = '0.3';
                    document.getElementById('search_panel').style.opacity = '0.3';
                }
            });
        }
    </script>
</body>
</html>
